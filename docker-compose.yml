# Full stack: `docker compose up --build` and open http://localhost:8080
# Development: `docker compose up -d db`, then run the API and the client from source (see README).
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: ${POSTGRES_DB:-planner}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - ${PLANNER_DATA_ROOT:-./.data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-planner}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLANNER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD:-planner}@db:5432/${POSTGRES_DB:-planner}
      PLANNER_SECRET_KEY: ${PLANNER_SECRET_KEY:?set PLANNER_SECRET_KEY in .env}
      PLANNER_CORS_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "${APP_PORT:-8080}:8000"
